    :root {

      --accent: #8b3a2a;
      --chip: #ece6dc;
      --east: #2c4a3e;
      --west: #6b3a28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header, .toolbar, main, footer {
      max-width: 980px;
      margin: 0 auto;
      padding-left: 20px;
      padding-right: 20px;
    }
    header { padding-top: 28px; padding-bottom: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 12px; }
    .notice {
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .toolbar { display: grid; gap: 12px; padding-bottom: 16px; }
    input[type="search"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--card);
    }
    .menu {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 8px 12px;
      align-items: center;
    }
    .menu-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button {
      border: 1px solid var(--line);
      background: var(--chip);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .chips button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    main { padding-bottom: 48px; }
    h2 { font-size: 1.05rem; margin: 24px 0 10px; }
    .count { color: var(--muted); font-weight: 400; }
    .floor-block { margin-bottom: 28px; }
    .floor-heading {
      font-size: 1rem;
      margin: 0 0 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--ink);
    }
    .tables {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .unknown-block { margin-top: 12px; }
    .table-wrap { overflow-x: auto; }
    .table-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin: 0 0 8px;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .table-title.east { background: #dce8e2; color: var(--east); }
    .table-title.west { background: #eadfd6; color: var(--west); }
    .table-title.unknown { background: #e4e2dc; color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #efe9df;
      font-weight: 700;
      white-space: nowrap;
    }
    td.phone { white-space: nowrap; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 8px 2px; }
    footer { padding-bottom: 40px; font-size: 0.8rem; color: var(--muted); }
    @media (max-width: 800px) {
      .tables { grid-template-columns: 1fr; }
      .menu { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>

      { id: "S063", name: "메종포인트발레학원", sign: "", phone: "", address: "1-505·1-506호", category: "교육", floor: "5", wing: "동관", ho: "1-505~506" },
      { id: "S064", name: "본죽&비빔밥 잠원역점", sign: "", phone: "02-537-6288", address: "지하1층", category: "음식", floor: "B1", wing: "미확인", ho: "미확인" },
      { id: "S065", name: "페리오치과의원", sign: "", phone: "02-571-2875", address: "1동 5층 503~504호", category: "의료", floor: "5", wing: "동관", ho: "503~504" },
      { id: "S066", name: "이화양내과의원", sign: "", phone: "02-595-7505", address: "2동 307~310호", category: "의료", floor: "3", wing: "서관", ho: "307~310" },
      { id: "S067", name: "라쿠치 잠원점", sign: "", phone: "", address: "1층 2…", category: "음식", floor: "1", wing: "서관", ho: "미확인" },
      { id: "S068", name: "히크헤어", sign: "heeq", phone: "", address: "서관 313호", category: "생활", floor: "3", wing: "서관", ho: "313" },
      { id: "S069", name: "로데오안경원 잠원점", sign: "", phone: "", address: "지하1층 B109", category: "생활", floor: "B1", wing: "동관", ho: "1-B109" },
      { id: "S070", name: "레드바틀 잠원점", sign: "", phone: "", address: "지하1층", category: "생활", floor: "B1", wing: "미확인", ho: "미확인" },
      { id: "S071", name: "이렘아트스튜디오", sign: "", phone: "", address: "1-411호", category: "교육", floor: "4", wing: "동관", ho: "1-411" },
      { id: "S072", name: "헤라스아트", sign: "", phone: "", address: "동관 106호", category: "생활", floor: "1", wing: "동관", ho: "1-106" },
      { id: "S073", name: "아이스무빙 메이플자이점", sign: "", phone: "", address: "2동 1층", category: "생활", floor: "1", wing: "서관", ho: "미확인" },
      { id: "S074", name: "만만마켓 잠원메이플자이점", sign: "", phone: "", address: "지하1층", category: "생활", floor: "B1", wing: "미확인", ho: "미확인" }
    ];

    const PENDING = [
      { name: "최지연국어교습소", hint: "이 건물 · 층 미확인" },
      { name: "안목안경", hint: "이 건물 · 0502-1937-0110 · 층·호 미확인" },
      { name: "모바피티앤필라테스", hint: "이 건물(서관 표기) · 층·호 미확인 · 모바스튜디오" },
      { name: "아비다선살롱 잠원점", hint: "이 건물 · 층·호 미확인" },
      { name: "플랜에이치 잠원점", hint: "포털에 잠원로4길 33-2 스타빌딩 · 메이플자이 상가 여부 보류" },
      { name: "부위부위정육점 잠원메이플자이점", hint: "이 건물(사업자·포털) · 층·호 미확인" },
      { name: "나이스가이 메이플자이점", hint: "이 건물 · 층·호 미확인" },
      { name: "블랑제리 메이에르 잠원", hint: "동관 · 0507-1490-2434 · 층·호 미확인" },
      { name: "마인드케어심리치료센터", hint: "포털에 이 건물 · 공식주소는 서초중앙로 표기 · 현장 확인" },
      { name: "카페데이지", hint: "서관 · 층·호 미확인" }
    ];

    const FLOOR_LABEL = { ALL: "전체", "1": "1층", "2": "2층", "3": "3층", "4": "4층", "5": "5층", B1: "지하1층" };
    const FLOOR_ORDER = ["1", "2", "3", "4", "5", "B1"];
    const WING_LABEL = { ALL: "전체", 동관: "동관", 서관: "서관", 미확인: "관 미확인" };
    const WING_TITLE = { 동관: "동관 (1동)", 서관: "서관 (2동)", 미확인: "동·서 미확인" };
    let floor = "ALL";
    let wing = "ALL";

    function bindChips(el, map, get, set) {
      Object.keys(map).forEach((key) => {
        const btn = document.createElement("button");
        btn.textContent = map[key];
        btn.dataset.key = key;
        if (key === get()) btn.classList.add("active");
        btn.addEventListener("click", () => {
          set(key);
          [...el.children].forEach((b) => b.classList.toggle("active", b.dataset.key === key));
          render();
        });
        el.appendChild(btn);
      });
    }
    bindChips(document.getElementById("wings"), WING_LABEL, () => wing, (v) => { wing = v; });
    bindChips(document.getElementById("floors"), FLOOR_LABEL, () => floor, (v) => { floor = v; });
    document.getElementById("q").addEventListener("input", render);

    function telHref(phone) {
      return "tel:" + phone.replace(/[^0-9+]/g, "");
    }

    function sortShops(list) {
      return list.slice().sort((a, b) => {
        const fi = FLOOR_ORDER.indexOf(a.floor) - FLOOR_ORDER.indexOf(b.floor);
        if (fi !== 0) return fi;
        return a.ho.localeCompare(b.ho, "ko");
      });
    }

    function shopTable(list) {
      if (!list.length) return `<p class="empty">없음</p>`;
      const rows = sortShops(list).map((s) => {
        const phone = s.phone
          ? `<a href="${telHref(s.phone)}">${s.phone}</a>`
          : "—";
        const name = s.sign ? `${s.name}<div class="empty">${s.sign}</div>` : s.name;
        return `<tr>
          <td>${name}</td>
          <td>${s.ho}</td>
          <td class="phone">${phone}</td>
          <td>${s.category}</td>
        </tr>`;
      }).join("");
      return `<div class="table-wrap"><table>
        <thead><tr><th>상호</th><th>호수</th><th>전화</th><th>업종</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const shops = SHOPS.filter((s) => {
        if (floor !== "ALL" && s.floor !== floor) return false;
        if (wing !== "ALL" && s.wing !== wing) return false;
        if (!q) return true;
        return [s.name, s.sign, s.phone, s.address, s.ho, s.category, s.wing].join(" ").toLowerCase().includes(q);
      });
      const pending = PENDING.filter((s) => {
        if (floor !== "ALL" || wing !== "ALL") return false;
        if (!q) return true;
        return [s.name, s.hint].join(" ").toLowerCase().includes(q);
      });

      document.getElementById("shop-count").textContent = `(${shops.length})`;
      document.getElementById("pending-count").textContent = `(${pending.length})`;

      if (!shops.length) {
        document.getElementById("shops").innerHTML = `<p class="empty">이 조건에 해당하는 가게가 없습니다.</p>`;
      } else {
        const floors = FLOOR_ORDER.filter((f) => shops.some((s) => s.floor === f));
        document.getElementById("shops").innerHTML = floors.map((f) => {
          const onFloor = shops.filter((s) => s.floor === f);
          const east = onFloor.filter((s) => s.wing === "동관");
          const west = onFloor.filter((s) => s.wing === "서관");
          const unknown = onFloor.filter((s) => s.wing === "미확인");
          const pair = [];
          if (east.length) pair.push(`<div><div class="table-title east">${WING_TITLE["동관"]}</div>${shopTable(east)}</div>`);
          if (west.length) pair.push(`<div><div class="table-title west">${WING_TITLE["서관"]}</div>${shopTable(west)}</div>`);
          const pairHtml = pair.length
            ? `<div class="${pair.length > 1 ? "tables" : ""}">${pair.join("")}</div>`
            : "";
          const unknownHtml = unknown.length
            ? `<div class="unknown-block"><div class="table-title unknown">${WING_TITLE["미확인"]}</div>${shopTable(unknown)}</div>`
            : "";
          return `<div class="floor-block">
            <h3 class="floor-heading">${FLOOR_LABEL[f]}</h3>
            ${pairHtml}${unknownHtml}
          </div>`;
        }).join("");
      }

      document.getElementById("pending").innerHTML = pending.length
        ? `<div class="table-wrap"><table>
            <thead><tr><th>상호</th><th>메모</th></tr></thead>
            <tbody>${pending.map((s) => `<tr><td>${s.name}</td><td>${s.hint}</td></tr>`).join("")}</tbody>
          </table></div>`
        : `<p class="empty">${floor === "ALL" && wing === "ALL" ? "없습니다." : "호수 미확인은 동·서·층을 전체로 두면 보입니다."}</p>`;
    }

    render();
  </script>
</body>
</html>
